[package]
name = "identity-disc-vault"
version = "0.1.0"
edition = "2021"
description = "Zero-trust developer secret injector and cloud bootstrap CLI enforcing hardware key and passkey verification"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = { version = "1.8", features = ["derive"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
